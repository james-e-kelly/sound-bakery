# This is a basic workflow to help you get started with the GitHub Auto-Release on Commit Action.
name: AutoRelease

on:
  push:
    branches: [ main ]

jobs:
  build_linux:
    name: Build On Linux GCC And Clang
    uses: ./.github/workflows/linux.yaml
  build_mac:
    name: Build On Mac
    uses: ./.github/workflows/macos.yaml
  build_windows:
    name: Build On Windows
    uses: ./.github/workflows/windows.yaml
  release:
    name: Create Release
    needs: [build_linux, build_mac, build_windows]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.3
      - name: Create Auto Release
        id: auto_release 
        uses: CupOfTea696/gh-action-auto-release@v1.0.0
        with:
          title: "Release: $version"
          tag: "v$semver"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Release Was Created
        if: ${{ steps.auto_release.outputs.released == false }}
        run: exit 1
      - name: Download Windows Dist
        uses: actions/download-artifact@v4.1.5
        with:
          name: windows-dist
          path: win
      - name: Download Mac Dist
        uses: actions/download-artifact@v4.1.5
        with:
          name: mac-dist
          path: mac
      - name: Download Linux Clang Dist
        uses: actions/download-artifact@v4.1.5
        with:
          name: linux-clang-dist
          path: linux-clang
      - name: Download Linux GCC Dist
        uses: actions/download-artifact@v4.1.5
        with:
          name: linux-gcc-dist
          path: linux-gcc
      - name: Zip Windows Dist
        run: |
          zip -r win-dist.zip ./win
      - name: Zip Mac Dist
        run: |
          zip -r mac-dist.zip ./mac
      - name: Zip Linux Clang Dist
        run: |
          zip -r linux-clang-dist.zip ./linux-clang
      - name: Zip Linux GCC Dist
        run: |
          zip -r linux-gcc-dist.zip ./linux-gcc
      - name: Upload Windows Dist
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.auto_release.outputs.upload_url }}
          asset_path: ./win-dist.zip
          asset_name: win-dist.zip
          asset_content_type: application/zip
      - name: Upload Mac Dist
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.auto_release.outputs.upload_url }}
          asset_path: ./mac-dist.zip
          asset_name: mac-dist.zip
          asset_content_type: application/zip
      - name: Upload Linux Clang Dist
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.auto_release.outputs.upload_url }}
          asset_path: ./linux-clang-dist.zip
          asset_name: linux-clang-dist.zip
          asset_content_type: application/zip
      - name: Upload Linux GCC Dist
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.auto_release.outputs.upload_url }}
          asset_path: ./linux-gcc-dist.zip
          asset_name: linux-gcc-dist.zip
          asset_content_type: application/zip
