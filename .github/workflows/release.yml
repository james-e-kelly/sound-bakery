# Cutting a release: push a semver tag, e.g.
#   git tag v0.4.0 && git push origin v0.4.0
# This builds every platform and drafts a GitHub release with all dist artifacts
# attached. The release is always a draft, so a human reviews and publishes it
# (and can attach extra files first).
name: Release

on:
  push:
    tags:
      - 'v*'

# Only the release job needs write access to create the draft release; the
# reusable build workflows below run with their own read-only permissions.
permissions:
  contents: write

jobs:
  check_version:
    name: Verify tag matches project version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches CMake project version
        shell: bash
        # Guards against the tag and project(VERSION ...) drifting apart. The
        # numeric core is compared, so a pre-release tag (v0.4.0-rc1) is allowed
        # as long as its version matches CMakeLists.txt.
        run: |
          tag="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          tag_core="${tag%%-*}"        # strip any -rc1 / -beta suffix
          cmake_version=$(grep -m1 -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "Tag version:   $tag_core (from tag $GITHUB_REF_NAME)"
          echo "CMake version: $cmake_version"
          if [ -z "$cmake_version" ]; then
            echo "::error::Could not read project(VERSION ...) from CMakeLists.txt"
            exit 1
          fi
          if [ "$tag_core" != "$cmake_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $cmake_version). Bump CMakeLists.txt or retag."
            exit 1
          fi

  # Ship every configuration a game might link against: Debug (full checks,
  # debug CRT), Profile (optimized + logging + profiling) and Release (stripped).
  # Each platform build installs all three into one dist tree under Wwise-style
  # per-config folders. PR/push runs keep the workflows' Release-only default.
  build_linux:
    name: Build On Linux GCC And Clang
    needs: check_version
    uses: ./.github/workflows/linux.yaml
    with:
      build_types: "Debug RelWithDebInfo Release"
  build_mac:
    name: Build On Mac
    needs: check_version
    uses: ./.github/workflows/macos.yaml
    with:
      build_types: "Debug RelWithDebInfo Release"
  build_windows:
    name: Build On Windows
    needs: check_version
    uses: ./.github/workflows/windows.yaml
    with:
      build_types: "Debug RelWithDebInfo Release"

  release:
    name: Create Release
    needs: [build_linux, build_mac, build_windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        shell: bash
        # download-artifact drops each uploaded artifact into its own subdirectory
        # (windows-dist, mac-dist, linux-gcc-dist, linux-clang-dist). Zip each one.
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$name"
          done
          cd ..
          ls -la ./*.zip

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: ./*.zip
          fail_on_unmatched_files: true
