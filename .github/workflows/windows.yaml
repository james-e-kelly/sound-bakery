name: Windows

on:
  workflow_dispatch:
    inputs:
      build_types:
        description: "Space-separated CMake configurations to build, test and install"
        default: "Release"
        type: string
  workflow_call:
    inputs:
      build_types:
        description: "Space-separated CMake configurations to build, test and install"
        default: "Release"
        type: string
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

# Builds only need to read the repository. The release workflow grants its own
# (broader) permissions when it calls this workflow.
permissions:
  contents: read

# Cancel superseded PR runs so rapid pushes don't pile up. Cancellation is
# limited to pull_request events on purpose: when the release workflow calls
# this one, github.workflow resolves to the caller for all platforms, so
# cancelling there would let the platform builds cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Release builds compile every configuration (Debug/Profile/Release) in
    # series, so this is generous compared with the Release-only PR/push runs.
    timeout-minutes: 150

    strategy:
      fail-fast: false

      matrix:
        os: [windows-latest]
        c_compiler: [cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Cache CMake dependencies
      uses: actions/cache@v4
      with:
        # The Visual Studio generator is multi-config: one build tree serves
        # every configuration, so the dependency cache lives under a single dir.
        path: |
          build/_deps
          build/cpm/cache
        # Exact key only (no restore-keys): when a dependency pin changes the
        # cache is rebuilt from scratch rather than partially restored, so stale
        # artifacts can't leak in. Bump the "v1" token if a runner toolchain
        # update ever leaves incompatible cached objects behind.
        key: deps-v1-${{ runner.os }}-${{ matrix.c_compiler }}-${{ hashFiles('cmake/build_sound_bakery.cmake', 'cmake/build_nfd.cmake', 'cmake/build_imgui.cmake', 'cmake/build_mpv.cmake', 'cmake/build_review.cmake', 'src/CMakeLists.txt', 'src/gluten/CMakeLists.txt', 'src/sound_chef/CMakeLists.txt', 'src/core/CMakeLists.txt', 'resources/CMakeLists.txt', 'tests/CMakeLists.txt', 'docs/doxygen/CMakeLists.txt') }}

    - name: Configure CMake
      # Multi-config generator: configure once (CMAKE_BUILD_TYPE is ignored),
      # then select the configuration per build/test/install below.
      run: >
        cmake -B build
        -DSOUND_BAKERY_TESTS=ON
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -S ${{ github.workspace }}

    - name: Build, test and install configurations
      shell: bash
      # BUILD_TYPES is Release for PR/push runs and the full set for releases.
      # Every configuration installs into the same dist tree; the per-config
      # install layout (lib/<Config>/…) keeps them from clobbering each other.
      env:
        BUILD_TYPES: ${{ inputs.build_types || 'Release' }}
      run: |
        set -euo pipefail
        for cfg in $BUILD_TYPES; do
          echo "::group::Build/test/install $cfg"
          cmake --build build --config "$cfg" --parallel
          ctest --test-dir build --build-config "$cfg" --output-on-failure
          cmake --install build --config "$cfg"
          echo "::endgroup::"
        done

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-dist
        path: dist/**/*
        if-no-files-found: error
        retention-days: 1
        overwrite: true
